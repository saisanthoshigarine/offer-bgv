<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — OfferFlow</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--blue:#1a56db;--green:#10b981;--red:#ef4444;--border:#e2e8f0;--muted:#64748b;--navy:#0d1b3e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0d1b3e 0%,#1a3a7a 60%,#0ea5e9 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:48px 40px;max-width:420px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.2)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#0ea5e9,var(--blue));border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:1.4rem;color:#fff}
.logo h1{font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--navy);margin-bottom:4px}
.logo p{color:var(--muted);font-size:.85rem}
.form-group{margin-bottom:16px}
label{display:block;font-weight:600;font-size:.8rem;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.pw-wrap{position:relative}
.form-control{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif}
.form-control:focus{border-color:var(--blue)}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted)}
.pw-req{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);margin-top:4px}
.pw-req.met{color:var(--green)}.pw-req.unmet{color:var(--red)}
.btn{display:block;width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;transition:background .2s;margin-top:8px}
.btn:hover{background:#1248c0}
#msg{font-size:.85rem;padding:10px;border-radius:8px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-key"></i></div>
    <h1>Reset Password</h1>
    <p>Create a new strong password for your account</p>
  </div>
  <div class="form-group">
    <label>New Password</label>
    <div class="pw-wrap">
      <input class="form-control" id="newPw" type="password" placeholder="New password" oninput="checkPw()">
      <button class="pw-toggle" onclick="toggle('newPw',this)"><i class="fas fa-eye"></i></button>
    </div>
    <div id="req-len" class="pw-req"><i class="fas fa-circle" style="font-size:.5rem"></i> 8+ characters</div>
    <div id="req-up" class="pw-req"><i class="fas fa-circle" style="font-size:.5rem"></i> Uppercase</div>
    <div id="req-lo" class="pw-req"><i class="fas fa-circle" style="font-size:.5rem"></i> Lowercase</div>
    <div id="req-sp" class="pw-req"><i class="fas fa-circle" style="font-size:.5rem"></i> Special character</div>
  </div>
  <div class="form-group">
    <label>Confirm Password</label>
    <div class="pw-wrap">
      <input class="form-control" id="confPw" type="password" placeholder="Repeat password">
      <button class="pw-toggle" onclick="toggle('confPw',this)"><i class="fas fa-eye"></i></button>
    </div>
  </div>
  <button class="btn" onclick="doReset()"><i class="fas fa-lock"></i> Set New Password</button>
  <div id="msg"></div>
</div>
<script>
const TOKEN="{{ token }}";
function toggle(id,btn){const i=document.getElementById(id);const s=i.type==='password';i.type=s?'text':'password';btn.innerHTML=s?'<i class="fas fa-eye-slash"></i>':'<i class="fas fa-eye"></i>'}
function checkPw(){
  const pw=document.getElementById('newPw').value;
  const s=(id,c)=>{const el=document.getElementById(id);el.className='pw-req '+(c?'met':'unmet');el.querySelector('i').className='fas '+(c?'fa-check-circle':'fa-times-circle')};
  s('req-len',pw.length>=8);s('req-up',/[A-Z]/.test(pw));s('req-lo',/[a-z]/.test(pw));s('req-sp',/[^A-Za-z0-9]/.test(pw));
}
async function doReset(){
  const pw=document.getElementById('newPw').value;const conf=document.getElementById('confPw').value;
  const msg=document.getElementById('msg');msg.style.display='none';
  const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,password:pw,confirm_password:conf})});
  const d=await r.json();msg.style.display='block';
  if(d.success){msg.style.background='#d1fae5';msg.style.color='#065f46';msg.textContent='Password reset! Redirecting...';setTimeout(()=>location.href='/login',1500)}
  else{msg.style.background='#fee2e2';msg.style.color='#991b1b';msg.textContent=d.message}
}
</script>
</body></html>
